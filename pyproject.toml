[project]
name = "godotk"
version = "0.1.0"
description = "Native Godot control for agents and humans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
godotk = "godotk.cli:main"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
source-include = ["tests/**", "uv.lock", ".python-version"]
